name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Regression tests
        run: npm test

      - name: Build Next.js
        run: npm run build:next

      - name: Responsive browser smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm run start > /tmp/lesfousdubus-next.log 2>&1 &
          NEXT_PID=$!
          trap 'kill "$NEXT_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl -fsS "http://127.0.0.1:3000/?count=12" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/lesfousdubus-next.log
              exit 1
            fi
            sleep 1
          done

          npm run test:ui
