<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Les Fous du Bus — Théorie du Siècle oublié">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1722"/>
      <stop offset="55%" stop-color="#13202e"/>
      <stop offset="100%" stop-color="#1c2a3a"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5fb9c2"/>
      <stop offset="52%" stop-color="#9face0"/>
      <stop offset="100%" stop-color="#d98b74"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f3efe6"/>
      <stop offset="60%" stop-color="#e0ab4e"/>
      <stop offset="100%" stop-color="#e0ab4e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#sea)"/>
  <!-- Moon -->
  <circle cx="960" cy="200" r="120" fill="url(#moon)"/>
  <!-- Horizon line -->
  <rect x="0" y="430" width="1280" height="4" fill="url(#horizon)"/>
  <!-- Title -->
  <text x="80" y="380" font-family="Georgia, serif" font-size="72" font-weight="800" fill="#f3efe6" letter-spacing="-2">Les Fous du Bus</text>
  <text x="80" y="460" font-family="Georgia, serif" font-size="38" font-weight="600" fill="url(#horizon)">Le Siècle oublié est le présent</text>
  <text x="80" y="510" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#aeb7c2">Théorie One Piece — vidéo de présentation</text>
  <!-- Play button outline -->
  <circle cx="640" cy="600" r="46" fill="#8091cf" opacity="0.92"/>
  <polygon points="625,578 625,622 665,600" fill="#0e1722"/>
</svg>
